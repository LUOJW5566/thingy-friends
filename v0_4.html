<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#fff7ee"><title>THINGY FRIENDS V0.4</title><style>:root{--bg:#fff7ee;--ink:#2b2522;--muted:#84776f;--line:#eadfd4;--card:#fffdfa;--shell1:#e7aa74;--shell2:#cb8350;--screen:#3b2929;--shadow:0 18px 48px rgba(87,57,43,.12)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 8% 0,#ffe5ef 0,transparent 28%),radial-gradient(circle at 100% 3%,#fff0bd 0,transparent 28%),var(--bg);color:var(--ink)}button{font:inherit;color:inherit}.app{max-width:1120px;margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.brand{font-weight:950}.sub{font-size:10px;color:var(--muted);margin-top:2px}.badge{font-size:9px;border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:99px}.card{background:rgba(255,253,250,.95);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.charbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;margin-bottom:9px}.cbtn{border:0;background:transparent;border-radius:15px;padding:8px 5px;font-size:9px;font-weight:850}.cbtn span{display:block;font-size:22px}.cbtn.on{background:#fff;border:1px solid var(--line);box-shadow:0 5px 15px #4a342914}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:9px}.hero{padding:15px;overflow:hidden}.titleRow{display:flex;justify-content:space-between}.kicker{font-size:9px;letter-spacing:.13em;color:var(--muted);font-weight:900}.hero h1{font-size:24px;margin:4px 0}.tiny{font-size:9px;color:var(--muted)}.stage{height:470px;display:grid;place-items:center;position:relative}.shell{position:relative;width:330px;height:390px;filter:drop-shadow(0 24px 28px rgba(79,49,33,.2));transition:.3s}.hook{position:absolute;z-index:-1;left:50%;top:-22px;transform:translateX(-50%);width:62px;height:78px;border:10px solid #433b37;border-bottom:0;border-radius:34px 34px 0 0}.shellBody{position:absolute;inset:28px 18px 12px;background:linear-gradient(145deg,var(--shell1),var(--shell2));border-radius:42% 42% 28% 29%/28% 30% 28% 28%;box-shadow:inset 12px 12px 20px #ffffff3d,inset -12px -14px 22px #5d341f24}.shellBody:before{content:"";position:absolute;inset:18px;background:#f8cd87;border-radius:40% 40% 24% 26%;opacity:.9}.screenFrame{position:absolute;z-index:5;width:236px;height:236px;left:47px;top:104px;border-radius:50%;background:#4f3432;border:9px solid #6f4b43;box-shadow:inset 0 0 0 3px #ffffff12,0 10px 20px #4a2c2525;overflow:hidden}.screen{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 35%,#5e4447,#241d24 75%);overflow:hidden;color:white;touch-action:manipulation}.life{position:absolute;inset:0;display:grid;place-items:center;transition:.35s}.life svg{width:100%;height:100%}.screenText{position:absolute;left:18px;right:18px;bottom:17px;z-index:8;text-align:center;font-size:11px;font-weight:800;line-height:1.3;padding:7px 9px;border-radius:13px;background:#ffffffeb;color:#352a27;box-shadow:0 8px 16px #0002;opacity:0;transform:translateY(10px);transition:.2s}.screenText.show{opacity:1;transform:translateY(0)}.topStatus{position:absolute;top:13px;left:18px;right:18px;z-index:8;display:flex;justify-content:space-between;font-size:8px;color:#f6eaf0aa}.identity{text-align:center;margin-top:-6px}.identity b{font-size:17px}.identity p{font-size:10px;color:var(--muted);line-height:1.5;margin:5px auto;max-width:480px}.stats{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{font-size:9px;border:1px solid var(--line);background:#fff;padding:6px 8px;border-radius:99px}.side{display:grid;gap:9px}.panel{padding:14px}.panel h3{font-size:13px;margin:0 0 9px}.primary{width:100%;border:0;background:#2b2522;color:white;border-radius:15px;padding:12px;font-weight:850}.primary.ok{background:#347860}.note{font-size:9px;line-height:1.45;color:var(--muted);margin-top:6px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.act{border:1px solid var(--line);background:white;border-radius:12px;min-height:51px;font-size:8px;font-weight:780;padding:5px}.act span{display:block;font-size:18px}.progress{margin:7px 0}.prow{display:grid;grid-template-columns:62px 1fr 36px;gap:6px;align-items:center;font-size:9px}.bar{height:7px;background:#eee5db;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd35f,#ff8eac)}.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.stageChip{font-size:7px;text-align:center;padding:6px 2px;border-radius:9px;background:#f3ece6;color:#a4978d}.stageChip.on{background:#fff0bf;color:#493a32;box-shadow:0 0 0 2px #ffe195}.tabs{display:flex;gap:5px;margin-top:8px}.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 4px;font-size:8px;font-weight:800}.tab.on{background:#2b2522;color:#fff}.tabpane{display:none;margin-top:8px}.tabpane.on{display:block}.socialGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px;font-size:9px}.mini b{display:block;margin-bottom:4px}.heartline{text-align:center;padding:8px;border-radius:12px;background:#fff0f3;font-size:10px;font-weight:800}.gene{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.gene div{border:1px solid var(--line);background:white;border-radius:11px;padding:7px;font-size:8px}.baby{margin-top:7px;border:1px dashed #e2b85a;background:#fff8da;border-radius:13px;padding:9px;font-size:9px;line-height:1.45}button.grow{width:100%;margin-top:8px;border:1px solid #e2b85a;background:#fff2c6;border-radius:12px;padding:10px;font-size:9px;font-weight:850}@media(max-width:800px){.grid{grid-template-columns:1fr}.stage{height:445px}.shell{transform:scale(.92)}.actions{grid-template-columns:repeat(4,1fr)}}@media(max-width:390px){.shell{transform:scale(.84)}.stage{height:410px}.actions{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><header><div><div class="brand">THINGY FRIENDS · 物物朋友 V0.4</div><div class="sub">固定实体外壳 × 圆屏生命世界 × 熟悉度 × 社交 × 基因</div></div><div class="badge" id="secure">检测环境…</div></header><div class="card charbar"><button class="cbtn on" data-c="toast"><span>🍞</span>麦啰 · 烘焙屋</button><button class="cbtn" data-c="cup"><span>☕️</span>咕杯 · 咖啡屋</button><button class="cbtn" data-c="camera"><span>📷</span>咔米 · 暗箱屋</button><button class="cbtn" data-c="milk"><span>🍓</span>莓噜 · 奶盒屋</button></div><div class="grid"><section class="card hero"><div class="titleRow"><div><div class="kicker" id="kicker"></div><h1 id="name"></h1><div class="tiny">实体外壳始终不变；所有成长只发生在圆屏内部</div></div><div class="badge" id="phaseBadge"></div></div><div class="stage"><div class="shell"><div class="hook"></div><div class="shellBody"></div><div class="screenFrame"><div class="screen" id="screen"><div class="topStatus"><span id="relTop"></span><span id="batTop"></span></div><div class="life" id="life"></div><div class="screenText" id="screenText"></div></div></div></div></div><div class="identity"><b id="title"></b><p id="desc"></p></div><div class="stats"><div class="pill">成长 <b id="growth"></b>%</div><div class="pill">熟悉度 <b id="fam"></b>%</div><div class="pill">性格 <b id="personality"></b></div><div class="pill">关系 <b id="relation"></b></div></div></section><div class="side"><section class="card panel"><h3>📱 实机感知 / 互动</h3><button class="primary" id="sensorBtn">启用 iPhone 运动传感器</button><div class="note" id="msg">现实行为会改变成长、熟悉度和性格。</div><div class="actions" style="margin-top:8px"><button class="act" data-a="walk"><span>🚶</span>走路</button><button class="act" data-a="run"><span>🏃</span>跑步</button><button class="act" data-a="shake"><span>🫨</span>猛摇</button><button class="act" data-a="pet"><span>🫳</span>摸摸</button><button class="act" data-a="talk"><span>💬</span>它说话</button><button class="act" data-a="idle"><span>💤</span>冷落它</button><button class="act" data-a="feed"><span>🔌</span>吃电</button><button class="act" data-a="drain"><span>🪫</span>掉电</button></div></section><section class="card panel"><h3>🌱 生命周期</h3><div class="progress"><div class="prow"><span>成长</span><div class="bar"><div class="fill" id="growthBar"></div></div><b id="growthN"></b></div></div><div class="progress"><div class="prow"><span>熟悉度</span><div class="bar"><div class="fill" id="famBar"></div></div><b id="famN"></b></div></div><div class="stages" id="stages"></div><button class="grow" id="growBtn">⚡ Demo：推进一个成长阶段</button></section><section class="card panel"><h3>🧬 宠物世界</h3><div class="tabs"><button class="tab on" data-tab="unlock">解锁</button><button class="tab" data-tab="social">社交</button><button class="tab" data-tab="gene">基因/宝宝</button></div><div class="tabpane on" id="unlock"><div class="mini"><b>互动会随成长解锁</b><div id="unlockText"></div></div></div><div class="tabpane" id="social"><div class="socialGrid"><div class="mini"><b>我的宠物</b><span id="minePet"></span></div><div class="mini"><b>对方宠物</b><span>🍓 莓噜 · 熟人</span></div></div><div class="heartline" id="loveLine"></div><button class="grow" id="meetBtn">让两只宠物见面一次</button></div><div class="tabpane" id="gene"><div class="gene" id="geneGrid"></div><button class="grow" id="babyBtn">生成一个 Demo 宝宝</button><div class="baby" id="babyBox">还没有宝宝。关系成熟后，宝宝会继承双方的外观与性格倾向。</div></div></section></div></div></div><script>const $=s=>document.querySelector(s),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));const defs={toast:{name:"MELLO 麦啰",kicker:"BAKERY HOME · 001",shell1:"#e7aa74",shell2:"#cb8350",stages:["面粉","加蛋","面团","发酵","烘烤","吐司出生"],desc:["一小撮刚醒来的面粉","面粉里掉进了一颗蛋","黏糊糊的小面团","开始偷偷发酵","进入烘烤阶段","麦啰真正出生了"],talks:{low:["你……是谁？","这里是哪里呀？","你会一直带着我吗？"],mid:["你回来啦。","今天出去玩吗？","摸一下也不是不行。"],high:["哟，终于想起我了？","今天这点步数，你认真的？","别摸了别摸了……再摸一下。"],savage:["哥们，今天就这点运动量？","你是不是背着我养别的了？","我都熟成这样了，还装不认识？"]},genes:{body:"Toast",feature:"Butter",color:"Caramel",trait:"Curious"}},cup:{name:"MUGU 咕杯",kicker:"COFFEE HOME · 002",shell1:"#bfe7d7",shell2:"#8ecdb7",stages:["空杯","咖啡豆","研磨","萃取","奶泡","咕杯出生"],desc:["一只空空的小杯子","几颗咖啡豆掉了进来","开始被日常晃动研磨","浓缩咖啡正在出现","奶泡慢慢成形","咕杯正式醒来"],talks:{low:["杯子里怎么空空的…","你是店员吗？","可以不要晃太快吗？"],mid:["今天要续杯吗？","你又来了。","摸杯沿可以。"],high:["哟，咖啡搭子。","今天精神不太行啊。","再熬夜我可不陪你。"],savage:["不是吧，又熬夜？","你这作息比我咖啡还黑。","我建议你先给自己充个电。"]},genes:{body:"Cup",feature:"Foam",color:"Mint",trait:"Calm"}},camera:{name:"CAMI 咔米",kicker:"DARKROOM HOME · 003",shell1:"#8d83a8",shell2:"#625a7a",stages:["暗箱","底片","显影","对焦","成像","咔米出生"],desc:["暗箱里什么都看不见","一张底片开始出现","轮廓正在慢慢显影","眼睛终于能对焦了","画面正在变清晰","咔米真正成像"],talks:{low:["谁开灯了？","这里好暗。","你是摄影师吗？"],mid:["今天拍什么？","我看到你啦。","别戳镜头。"],high:["构图一般，再来。","今天光挺烂的。","你拍糊了别赖我。"],savage:["这张也敢留？","你今天是对焦对到月球了？","别看我，先看你的快门。"]},genes:{body:"Camera",feature:"Lens",color:"Violet",trait:"Observant"}},milk:{name:"BERRI 莓噜",kicker:"MILK HOME · 004",shell1:"#ffd6e2",shell2:"#efa5bb",stages:["白牛奶","草莓","混合","奶泡","变粉","莓噜出生"],desc:["盒子里只有白牛奶","一颗草莓掉进来了","走路把草莓慢慢摇散","奶泡开始冒出来","整盒正在变粉","莓噜真正醒来"],talks:{low:["你是谁呀…","这里甜甜的。","不要突然摇我。"],mid:["今天也带我嘛。","可以摸一下。","我有点想你。"],high:["你今天怎么这么晚？","再不摸我我要闹了。","哼，勉强原谅你。"],savage:["你今天是不是忘了我？","又想靠摸两下蒙混过关？","行吧，谁让我认识你这么久。"]},genes:{body:"Milk",feature:"Straw",color:"Strawberry",trait:"Clingy"}}};const state={char:"toast",phase:0,growth:8,fam:4,energy:28,cling:30,mischief:16,battery:76,love:6,meet:0};function d(){return defs[state.char]}function relation(){return state.fam<15?"陌生":state.fam<35?"认识":state.fam<55?"熟人":state.fam<75?"好朋友":state.fam<90?"死党":"老搭子"}function personality(){if(state.phase<4)return"未形成";if(state.mischief>state.cling&&state.mischief>state.energy)return"顽皮";if(state.cling>state.energy)return"黏人";return"活力"}function talkLine(){const p=d().talks,a=state.fam<25?p.low:state.fam<55?p.mid:state.fam<85?p.high:p.savage;let t=a[Math.floor(Math.random()*a.length)];if(state.fam>55&&personality()==="顽皮")t+=" 😏";if(state.fam>55&&personality()==="黏人"&&Math.random()>.5)t+=" ♥";return t}function say(t,ms=2000){const e=$("#screenText");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),ms)}function face(){return '<circle cx="88" cy="86" r="7" fill="#fff"/><circle cx="132" cy="84" r="7" fill="#fff"/><circle cx="89" cy="87" r="3.2" fill="#2b2522"/><circle cx="133" cy="85" r="3.2" fill="#2b2522"/><path d="M94 112 Q110 123 126 111" stroke="#fff0ee" stroke-width="5" fill="none" stroke-linecap="round"/>'}function lifeSVG(){let p=state.phase;if(state.char==="toast"){if(p===0)return '<svg viewBox="0 0 220 220"><ellipse cx="110" cy="134" rx="60" ry="26" fill="#f2dfc2"/><circle cx="91" cy="128" r="4" fill="#3c302b"/><circle cx="129" cy="128" r="4" fill="#3c302b"/></svg>';if(p===1)return '<svg viewBox="0 0 220 220"><ellipse cx="110" cy="140" rx="65" ry="28" fill="#f2dfc2"/><ellipse cx="110" cy="119" rx="28" ry="34" fill="#ffd56a"/></svg>';if(p===2)return '<svg viewBox="0 0 220 220"><ellipse cx="110" cy="127" rx="68" ry="47" fill="#ead0a3"/>'+face()+'</svg>';if(p===3)return '<svg viewBox="0 0 220 220"><ellipse cx="110" cy="122" rx="76" ry="58" fill="#ead0a3"/>'+face()+'<text x="165" y="65" font-size="20">↑</text></svg>';if(p===4)return '<svg viewBox="0 0 220 220"><rect x="48" y="51" width="124" height="126" rx="48" fill="#d99155"/><rect x="62" y="68" width="96" height="96" rx="38" fill="#f2c777"/>'+face()+'<text x="95" y="40" font-size="22">🔥</text></svg>';return '<svg viewBox="0 0 220 220"><rect x="43" y="42" width="134" height="142" rx="48" fill="#d99155"/><rect x="57" y="59" width="106" height="108" rx="38" fill="#f3cc81"/>'+face()+'<rect x="70" y="45" width="58" height="34" rx="14" fill="#ffd65b" transform="rotate(-9 99 62)"/></svg>'}if(state.char==="cu
