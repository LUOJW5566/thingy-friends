v></div><script>const $=s=>document.querySelector(s),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));const C={toast:{name:'MELLO 麦啰',k:'BREAKFAST GANG · 001',title:'刚烤好的胆小吐司',desc:'黄油是它的头发。运动多会变得焦脆精神，摸得多会融成软软刘海。',b1:'#efad72',b2:'#d98a54',face:'#673a32',hun:['肚子空空的…我饿了 🥺','给我吃一点电嘛…🔌','再不充电，我要变成面包干了！']},cup:{name:'MUGU 咕杯',k:'DESK GANG · 002',title:'总是没睡醒的咖啡杯',desc:'杯里的咖啡就是情绪。走快会晃出咖啡浪，久坐会开始打瞌睡。',b1:'#d9f2e8',b2:'#9bd4c0',face:'#56362e',hun:['咖啡见底啦…我也没电了 ☕️','续杯！先给我充电！','空杯警告…我要睡着了。']},camera:{name:'CAMI 咔米',k:'WANDER GANG · 003',title:'什么都想偷看的小相机',desc:'镜头就是独眼。走路会到处观察，跑步会疯狂防抖，安静太久会自拍发呆。',b1:'#8d83a8',b2:'#625a7a',face:'#2f2a3e',hun:['电池红了！我拍不动啦 📷','摄影师！先给我充电！','最后一格电…我要关机装死了。']},milk:{name:'BERRI 莓噜',k:'SWEET GANG · 004',title:'吸管永远歪着的草莓奶',desc:'吸管就是呆毛。害羞会整盒变粉，运动后奶泡上升，被猛摇太多会很生气。',b1:'#ffd7e2',b2:'#f2a7bd',face:'#7d334d',hun:['吸不动啦…我饿了 🍓','给莓噜喝一点电吧…','空盒子了！快插充电线！']}};const S={};Object.keys(C).forEach(k=>S[k]={energy:28,cling:35,mis:16,bond:12,bat:76,lv:1});let cur='toast',sensor=false,flipped=false,baseZ=null,lastEvt=0,lastStep=0,steps=[],buf=[];try{let q=JSON.parse(localStorage.getItem('tf03'));if(q){Object.assign(S,q.S||{});cur=q.cur||cur}}catch(e){}function st(){return S[cur]}function save(){localStorage.setItem('tf03',JSON.stringify({cur,S}))}function vars(){let c=C[cur];document.documentElement.style.setProperty('--b1',c.b1);document.documentElement.style.setProperty('--b2',c.b2);document.documentElement.style.setProperty('--face',c.face)}function eyes(dx=0,dy=0,s=1){$('#pL').setAttribute('cx',73+dx);$('#pL').setAttribute('cy',92+dy);$('#pR').setAttribute('cx',134+dx);$('#pR').setAttribute('cy',89+dy);$('#pL').setAttribute('rx',11*s);$('#pR').setAttribute('rx',10*s)}function mouth(t){let d={happy:'M78 136 Q101 158 126 136',sad:'M80 151 Q103 132 125 151',flat:'M84 144 Q104 141 123 144',open:'M85 136 Q102 174 121 136 Q102 128 85 136',tiny:'M94 145 Q103 149 112 145'};$('#mouth').setAttribute('d',d[t]||d.happy)}function say(t,ms=1700){let s=$('#speech');s.textContent=
