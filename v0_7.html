<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6eee4">
<title>THINGY FRIENDS V0.7 · 物物朋友</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0e7;--ink:#43342d;--muted:#9a887c;--line:#ecdfd1;--card:#fffdf8;--cream:#fff6ea;--accent:#ff8fab;--accent2:#ffd166;--good:#347860;--shell1:#e8a15c;--shell2:#c97f4c;--shell3:#f3cf88;--shadow:0 24px 60px rgba(88,60,42,.14);--fontD:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;--fontB:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:var(--fontB);color:var(--ink)}
body{background:radial-gradient(circle at 6% -2%,#ffe2ec 0,transparent 30%),radial-gradient(circle at 98% 0%,#fff1bd 0,transparent 28%),radial-gradient(circle at 88% 100%,#e3f3e6 0,transparent 34%),radial-gradient(circle at 4% 96%,#e6ecff 0,transparent 32%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1120px;margin:auto;padding:16px 14px calc(30px + env(safe-area-inset-bottom));position:relative}
.deco{position:fixed;z-index:0;pointer-events:none;color:#e8c07a;opacity:.55;filter:drop-shadow(0 4px 8px rgba(120,80,40,.15));animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(12deg)}}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;position:relative;z-index:2}
.brandWrap{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,#fff,#f7e6d8);display:grid;place-items:center;box-shadow:0 8px 20px rgba(120,70,40,.16),inset 0 0 0 2px #fff;font-size:30px}
.brand{font-family:var(--fontD);font-size:24px;font-weight:900}
.brand small{display:block;font-family:var(--fontB);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;margin-top:1px}
.badge{font-size:11px;border:1.5px solid var(--line);background:rgba(255,255,255,.75);padding:7px 12px;border-radius:99px;box-shadow:0 4px 12px rgba(120,70,40,.06)}
.badge.rare{background:#fff4e0;border-color:#ffb84d;color:#b06a00}
.badge.secret{background:#f4ecff;border-color:#c9a4ff;color:#7a3fd0}
.card{background:rgba(255,253,248,.92);border:1.5px solid var(--line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.charbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;margin-bottom:14px;position:relative;z-index:2}
.cbtn{border:0;background:transparent;border-radius:18px;padding:10px 6px;font-size:11px;font-weight:800;font-family:var(--fontD);transition:.25s}
.cbtn .emo{display:block;font-size:26px;line-height:1;margin-bottom:3px;filter:drop-shadow(0 3px 4px rgba(120,70,40,.12));transition:.25s}
.cbtn.on{background:#fff;border:1.5px solid var(--line);box-shadow:0 10px 22px rgba(120,70,40,.14);transform:translateY(-2px)}
.cbtn.on .emo{transform:scale(1.15) rotate(-6deg)}
.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:14px;position:relative;z-index:2}
.hero{padding:22px 22px 18px;overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 12%,rgba(255,255,255,.6),transparent 40%);pointer-events:none}
.titleRow{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.kicker{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:800;text-transform:uppercase}
.hero h1{font-family:var(--fontD);font-size:30px;margin:5px 0 3px;line-height:1.1}
.tiny{font-size:10px;color:var(--muted)}
.stage{height:486px;display:grid;place-items:center;position:relative}
.shell{position:relative;width:330px;height:412px;filter:drop-shadow(0 30px 34px rgba(74,48,32,.28));transition:.35s}
.ring{position:absolute;z-index:1;left:50%;top:0;transform:translateX(-50%);width:46px;height:52px;border:9px solid #b6a89b;border-bottom:0;border-radius:26px 26px 0 0;box-shadow:inset 0 3px 4px #fff8}
.ring::after{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfc2b5);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.shellTab{position:absolute;z-index:2;left:50%;top:30px;transform:translateX(-50%);width:74px;height:26px;background:linear-gradient(180deg,var(--shell3),var(--shell1));border-radius:12px;box-shadow:0 6px 10px rgba(74,48,32,.18)}
.shellBody{position:absolute;z-index:3;inset:52px 22px 18px;background:linear-gradient(150deg,var(--shell1),var(--shell2));border-radius:46% 46% 36% 36%/32% 32% 28% 28%;box-shadow:inset -16px -20px 34px rgba(0,0,0,.22),inset 12px 16px 30px rgba(255,255,255,.42),0 2px 0 rgba(255,255,255,.35) inset}
.shellBody::before{content:"";position:absolute;left:12%;top:5%;width:36%;height:24%;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,0));border-radius:50%;filter:blur(1px)}
.shellBody::after{content:"";position:absolute;inset:20px;background:linear-gradient(150deg,var(--shell3),transparent 62%);border-radius:42% 42% 30% 30%/30% 30% 26% 26%;opacity:.55}
.faceplate{position:absolute;z-index:4;left:50%;top:15%;transform:translateX(-50%);width:120px;height:52px;display:flex;justify-content:center;align-items:center;gap:16px}
.faceplate i{display:block;width:15px;height:20px;border-radius:50% 50% 45% 45%;background:#3a2b27;position:relative}
.faceplate i::after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#fff}
.screenFrame{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-52%);width:250px;height:250px;border-radius:50%;background:linear-gradient(145deg,#5b4a42,#31241e);box-shadow:inset 0 4px 10px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.3),0 0 0 8px #46352e,0 0 0 10px rgba(255,255,255,.12);padding:9px}
.screen{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 34%,#5d4548,#251d25 76%);overflow:hidden;color:#fff;touch-action:manipulation;box-shadow:inset 0 0 26px rgba(0,0,0,.5)}
.screen::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.16),transparent 42%);pointer-events:none;z-index:7}
.life{position:absolute;inset:0;display:grid;place-items:center;z-index:4}
.life svg{width:100%;height:100%;animation:breathe 3.2s ease-in-out infinite}
.life.pop{animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03) translateY(-3px)}}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
.gaze{transform:translate(var(--gx,0px),var(--gy,0px));transition:transform .16s ease-out}
.aura{transform-box:fill-box;transform-origin:center;animation:auraPulse 2.6s ease-in-out infinite}
@keyframes auraPulse{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.05);opacity:.7}}
.spark{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0}
.spark.on{animation:sparkle .9s ease}
.spark::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 40px 18px #ffd166}
@keyframes sparkle{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
.eggShake{animation:eggShake .5s ease-in-out infinite}
@keyframes eggShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.topStatus{position:absolute;top:22px;left:30px;right:30px;z-index:8;display:flex;justify-content:space-between;font-size:10px;color:#f7ecf2d9;font-family:var(--fontB);letter-spacing:.02em}
.topStatus .bat{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.28);padding:2px 8px;border-radius:99px;white-space:nowrap}
.bubble{position:absolute;left:20px;right:20px;bottom:16px;z-index:8;text-align:center;font-size:11.5px;font-weight:800;line-height:1.35;padding:8px 10px;border-radius:14px;background:rgba(22,16,18,.72);color:#fff;backdrop-filter:blur(4px);opacity:0;transform:translateY(8px) scale(.96);transition:.22s;font-family:var(--fontD);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.bubble.show{opacity:1;transform:translateY(0) scale(1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);width:10px;height:10px;background:rgba(22,16,18,.72);clip-path:polygon(0 0,100% 0,50% 100%)}
.identity{text-align:center;margin-top:4px;position:relative;z-index:2}
.identity b{font-family:var(--fontD);font-size:18px}
.identity p{font-size:11px;color:var(--muted);line-height:1.55;margin:5px auto 0;max-width:480px}
.stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:2}
.pill{font-size:10px;border:1.5px solid var(--line);background:#fff;padding:7px 10px;border-radius:99px;box-shadow:0 4px 10px rgba(120,70,40,.05)}
.pill b{font-family:var(--fontD);color:#7a5237}
.side{display:grid;gap:14px}
.panel{padding:16px}
.panel h3{font-family:var(--fontD);font-size:15px;margin:0 0 11px;display:flex;align-items:center;gap:6px}
.primary{width:100%;border:0;background:#43342d;color:#fff;border-radius:16px;padding:13px;font-weight:800;font-family:var(--fontD);font-size:14px;box-shadow:0 10px 20px rgba(67,52,45,.24);transition:.2s}
.primary:active{transform:translateY(1px)}
.primary.ok{background:var(--good)}
.note{font-size:10px;line-height:1.5;color:var(--muted);margin-top:7px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.act{border:1.5px solid var(--line);background:#fff;border-radius:14px;min-height:56px;font-size:10px;font-weight:800;padding:6px;transition:.16s;font-family:var(--fontD)}
.act:active{transform:scale(.94);background:#fff3e8}
.act span{display:block;font-size:21px;margin-bottom:2px}
.progress{margin:8px 0}
.prow{display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:10.5px}
.bar{height:9px;background:#efe6db;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.stageChip{font-size:8.5px;text-align:center;padding:7px 3px;border-radius:10px;background:#f3ece6;color:#b3a699;transition:.2s;font-family:var(--fontD)}
.stageChip.on{background:linear-gradient(135deg,#fff0bf,#ffd9e3);color:#5a4030;box-shadow:0 0 0 2px #ffe195;transform:scale(1.05)}
.tabs{display:flex;gap:6px;margin-top:6px}
.tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:9px 4px;font-size:10px;font-weight:800;font-family:var(--fontD);transition:.2s}
.tab.on{background:#43342d;color:#fff;border-color:#43342d}
.tabpane{display:none;margin-top:10px}
.tabpane.on{display:block}
.socialGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-size:10px}
.mini b{display:block;margin-bottom:4px;font-family:var(--fontD);font-size:11.5px}
.partnerBar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.pbtn{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 2px;font-size:9px;font-weight:800;font-family:var(--fontD)}
.pbtn.on{background:#fff0f3;border-color:var(--accent)}
.heartline{text-align:center;padding:9px;border-radius:13px;background:#fff0f3;font-size:11px;font-weight:800;font-family:var(--fontD);margin-top:7px}
.gene{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.gene div{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-size:9.5px}
.babyCard{margin-top:9px;border:1.5px dashed #e2b85a;background:linear-gradient(160deg,#fff8da,#fff1e6);border-radius:16px;padding:12px;text-align:center}
.babyScreen{width:170px;height:170px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 34%,#5d4548,#251d25 76%);padding:6px;box-shadow:inset 0 0 18px rgba(0,0,0,.5);position:relative}
.babyScreen svg{width:100%;height:100%}
.babyScreen .egg{transform-box:fill-box;transform-origin:center;animation:eggWobble 1.4s ease-in-out infinite}
@keyframes eggWobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.babyScreen .hatch{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
.babyScreen .parentPet{animation:parentBob 1.6s ease-in-out infinite}
@keyframes parentBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.babyScreen .famHeart{animation:famHeart 1.3s ease-in-out infinite}
@keyframes famHeart{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.babyGenes{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:9px}
.gchip{font-size:9.5px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 9px}
.gchip b{font-family:var(--fontD)}
.gchip .swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px}
button.grow{width:100%;margin-top:9px;border:1.5px solid #e2b85a;background:#fff2c6;border-radius:14px;padding:11px;font-size:11px;font-weight:800;font-family:var(--fontD);transition:.2s}
button.grow:active{transform:scale(.97)}
.evoTree{display:flex;flex-direction:column;align-items:center;gap:7px}
.evoRoot{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px}
.evoRoot svg,.evoNode svg{width:56px;height:56px}
.evoLink{color:#d9c7b4;font-size:12px;line-height:1;margin:-1px 0}
.evoBranches{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%}
.evoNode{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;text-align:center;transition:.2s}
.evoNode .nm{font-family:var(--fontD);font-size:10px;display:block;margin-top:3px}
.evoNode .tp{font-size:8px;color:var(--muted)}
.evoNode .st{height:5px;background:#eee5db;border-radius:99px;overflow:hidden;margin-top:5px}
.evoNode .st i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.evoNode.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);transform:translateY(-2px)}
.socialStage{display:flex;align-items:flex-end;justify-content:center;position:relative;height:112px;margin-top:7px;overflow:hidden;border:1.5px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fff6f0,#fdf0f4)}
.socialStage svg{width:76px;height:76px}
.petSlot{transition:transform .55s cubic-bezier(.34,1.56,.64,1);z-index:2}
.socialStage.snuggle .petSlot.left{transform:translateX(30px)}
.socialStage.snuggle .petSlot.right{transform:translateX(-30px)}
.hearts{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.heartPop{position:absolute;font-size:16px;opacity:0;animation:heartFloat 1.2s ease-out forwards}
@keyframes heartFloat{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1.15)}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.stage{height:450px}.shell{transform:scale(.9)}}
@media(max-width:390px){.shell{transform:scale(.82)}.stage{height:410px}.actions{grid-template-columns:repeat(4,1fr)}.brand{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <div class="deco" style="top:8%;left:5%;font-size:30px">✦</div>
  <div class="deco" style="top:16%;right:7%;font-size:22px;animation-delay:-2s">✧</div>
  <div class="deco" style="top:60%;left:3%;font-size:24px;animation-delay:-4s">✿</div>
  <div class="deco" style="top:78%;right:4%;font-size:26px;animation-delay:-1s">✦</div>

  <header>
    <div class="brandWrap">
      <div class="logo" id="logoFace">🥚</div>
      <div>
        <div class="brand">THINGY FRIENDS<small>物物朋友 · 盲盒蛋 × 养成 × 双亲繁殖 × 实时感知</small></div>
      </div>
    </div>
    <div class="badge" id="secure">检测环境…</div>
  </header>

  <div class="card charbar">
    <button class="cbtn on" data-c="toast"><span class="emo">🍞</span>麦啰 · 烘焙屋</button>
    <button class="cbtn" data-c="cup"><span class="emo">☕️</span>咕杯 · 咖啡屋</button>
    <button class="cbtn" data-c="camera"><span class="emo">📷</span>咔米 · 暗箱屋</button>
    <button class="cbtn" data-c="milk"><span class="emo">🍓</span>莓噜 · 奶盒屋</button>
  </div>

  <div class="grid">
    <section class="card hero">
      <div class="titleRow">
        <div>
          <div class="kicker" id="kicker"></div>
          <h1 id="name"></h1>
          <div class="tiny">先开一颗盲盒蛋，再把它养大</div>
        </div>
        <div class="badge" id="phaseBadge"></div>
      </div>

      <div class="stage">
        <div class="shell" id="shell">
          <div class="ring"></div>
          <div class="shellTab"></div>
          <div class="shellBody"><div class="faceplate"><i></i><i></i></div></div>
          <div class="screenFrame">
            <div class="screen" id="screen">
              <div class="topStatus"><span class="bat" id="batTop">🔋</span><span class="bat" id="famTop">❤️</span></div>
              <div class="life" id="life"></div>
              <div class="spark" id="spark"></div>
              <div class="bubble" id="bubble"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="identity"><b id="title"></b><p id="desc"></p></div>
      <div class="stats">
        <div class="pill">形态 <b id="variant"></b></div>
        <div class="pill">成长 <b id="growth"></b>%</div>
        <div class="pill">熟悉度 <b id="fam"></b>%</div>
        <div class="pill">性格 <b id="personality"></b></div>
        <div class="pill">关系 <b id="relation"></b></div>
      </div>
    </section>

    <div class="side">
      <section class="card panel">
        <h3>📱 实机感知 / 互动</h3>
        <button class="primary" id="sensorBtn">启用 iPhone 运动传感器</button>
        <div class="note" id="msg">开启后：摇晃会晕、跑步会慌、眼球会跟着手机方向转。</div>
        <div class="actions" style="margin-top:10px">
          <button class="act" data-a="walk"><span>🚶</span>走路</button>
          <button class="act" data-a="run"><span>🏃</span>跑步</button>
          <button class="act" data-a="shake"><span>🫨</span>猛摇</button>
          <button class="act" data-a="pet"><span>🫳</span>摸摸</button>
          <button class="act" data-a="talk"><span>💬</span>说话</button>
          <button class="act" data-a="idle"><span>💤</span>冷落</button>
          <button class="act" data-a="feed"><span>🔌</span>吃电</button>
          <button class="act" data-a="drain"><span>🪫</span>掉电</button>
          <button class="act" data-a="lift"><span>🙌</span>举高高</button>
          <button class="act" data-a="tickle"><span>🪶</span>挠痒</button>
          <button class="act" data-a="flip"><span>🙃</span>倒挂</button>
          <button class="act" data-a="play"><span>🎲</span>陪玩</button>
        </div>
      </section>

      <section class="card panel">
        <h3>🥚 盲盒 · 10 阶段成长</h3>
        <div class="progress"><div class="prow"><span>成长</span><div class="bar"><div class="fill" id="growthBar"></div></div><b id="growthN"></b></div></div>
        <div class="progress"><div class="prow"><span>熟悉度</span><div class="bar"><div class="fill" id="famBar"></div></div><b id="famN"></b></div></div>
        <div class="stages" id="stages"></div>

function eyesFor(lx,rx,ey,r,ec,mood,eyeStyle){
  if(mood==='sleepy')return closedEyes(lx,rx,ey,r,ec);
  if(mood==='dizzy')return `<g stroke="${ec}" stroke-width="3.4" stroke-linecap="round"><path d="M${lx-r} ${ey-r} L${lx+r} ${ey+r}"/><path d="M${lx+r} ${ey-r} L${lx-r} ${ey+r}"/><path d="M${rx-r} ${ey-r} L${rx+r} ${ey+r}"/><path d="M${rx+r} ${ey-r} L${rx-r} ${ey+r}"/></g>`;
  if(mood==='love'||eyeStyle==='heart')return `<g fill="#ef6d91">${heartPath(lx,ey)}${heartPath(rx,ey)}</g>`;
  if(mood==='excited'||eyeStyle==='star')return `<g fill="${ec}">${starPath(lx,ey,r)}${starPath(rx,ey,r)}</g>`;
  if(mood==='sad'||eyeStyle==='droopy')return droopyEyes(lx,rx,ey,r,ec);
  return roundEyes(lx,rx,ey,r,ec);
}

  return `<g>${brow}<g class="gaze">${eyes}</g>${mouth}${bl}${shyMark}</g>`;
}

function sparkle(cx,cy,sz,c="#fff"){return `<path d="M${cx} ${cy-sz} Q${cx} ${cy} ${cx+sz} ${cy} Q${cx} ${cy} ${cx} ${cy+sz} Q${cx} ${cy} ${cx-sz} ${cy} Q${cx} ${cy} ${cx} ${cy-sz} Z" fill="${c}"/>`;}

function stageSVG(){
  if(!state.hatched)return `<svg viewBox="0 0 240 240">${eggArt(state.cracking||false)}</svg>`;
  const ch=state.char,v=state.variant,pal={c:v.c,c2:v.c2,acc:v.acc};
  const a=arch(),p=ph();
  const mood=state.faceMood||a.mood;
  if(p===1)return `<svg viewBox="0 0 240 240">${shellBits()}${scaleG(creature(ch,'excited',pal),0.5)}</svg>`;
  const scale=[0.58,0.7,0.8,0.9,1][Math.max(0,p-2)]||1;
  let inner=scaleG(creature(ch,mood,pal),scale);
  if(p>=7)inner+=signatureFeature(ch);
  if(p>=8)inner=`<circle cx="120" cy="120" r="112" fill="${a.color}" opacity=".15"/><circle class="aura" cx="120" cy="120" r="100" fill="none" stroke="${a.color}" stroke-width="2.5"/>${inner}`;
  if(p===9)inner+=`${sparkle(40,60,7,a.color)}${sparkle(200,52,5,a.color)}${sparkle(40,184,6,a.color)}${sparkle(204,184,6,a.color)}`;
  return `<svg viewBox="0 0 240 240">${inner}</svg>`;
}

/* ---------- 基因 & 宝宝 ---------- */
function geneOf(ch,variant){
  return {species:ch,variantName:variant.n,rarity:variant.r,c:variant.c,c2:variant.c2,acc:variant.acc,feature:SPECIES[ch].featureKey,ear:pick(EARS),eye:pick(EYES),pattern:pick(PATTERNS),size:pick(SIZES),trait:pick(TRAITS)};
}
function mergeGene(a,b){const p=(x,y)=>Math.random()>.5?x:y;return {species:p(a.species,b.species),variantName:"混血宝宝",rarity:"混血",c:p(a.c,b.c),c2:p(a.c2,b.c2),acc:p(a.acc,b.acc),feature:p(a.feature,b.feature),ear:p(a.ear,b.ear),eye:p(a.eye,b.eye),pattern:p(a.pattern,b.pattern),size:p(a.size,b.size),trait:p(a.trait,b.trait)};}
function bodyShape(type,c,c2){
  if(type==='toast')return `<rect x="76" y="86" width="88" height="90" rx="40" fill="${c}"/><rect x="85" y="95" width="70" height="72" rx="32" fill="${c2}" opacity=".55"/>`;

  if(type==='camera')return `<rect x="64" y="88" width="112" height="92" rx="24" fill="${c}"/><rect x="77" y="101" width="86" height="66" rx="14" fill="${c2}"/>`;
  return `<rect x="82" y="78" width="76" height="114" rx="20" fill="${c}"/><path d="M106 60 L120 60 L116 78 L110 78 Z" fill="${c2}"/>`;
}
function featureArt(f){
  if(f==='Butter')return `<rect x="98" y="74" width="44" height="20" rx="9" fill="#ffd75e" transform="rotate(-8 120 84)"/>`;
  if(f==='Foam')return `<g fill="#fff" opacity=".9"><circle cx="96" cy="80" r="7"/><circle cx="110" cy="74" r="9"/><circle cx="126" cy="78" r="7"/><circle cx="140" cy="84" r="5"/></g>`;
  if(f==='Lens')return `<circle cx="168" cy="98" r="16" fill="#8fd3f0" stroke="#5f9fbf" stroke-width="4"/><circle cx="168" cy="98" r="6" fill="#2b5f7a"/>`;
  return `<rect x="116" y="54" width="9" height="34" rx="4" fill="#ff7fa5" transform="rotate(8 120 62)"/>`;

function patternArt(p,c2){
  if(p==='dots')return `<g fill="${c2}" opacity=".7"><circle cx="90" cy="120" r="3"/><circle cx="150" cy="120" r="3"/><circle cx="120" cy="152" r="3"/></g>`;
  if(p==='stripes')return `<g stroke="${c2}" stroke-width="4" opacity=".5"><path d="M85 110 L110 110"/><path d="M85 122 L110 122"/><path d="M130 110 L155 110"/><path d="M130 122 L155 122"/></g>`;
  if(p==='shine')return `<circle cx="96" cy="100" r="8" fill="#fff" opacity=".5"/>`;
  if(p==='sprinkle')return `<g fill="${c2}" opacity=".9"><rect x="88" y="110" width="4" height="4" rx="1" transform="rotate(20 90 112)"/><rect x="148" y="116" width="4" height="4" rx="1" transform="rotate(-20 150 118)"/><rect x="120" y="148" width="4" height="4" rx="1"/><rect x="100" y="140" width="3" height="3" rx="1"/></g>`;

function babyInner(g){
  const mood=GENE_MOOD[g.trait]||'happy';
  const ears=g.ear==='point'?pointedEars(g.c):g.ear==='round'?roundEarArt(g.c):g.ear==='fluffy'?fluffyEars(g.c):'';
  const size=g.size==='large'?1.08:g.size==='small'?0.92:1;
  return `<g transform="translate(120 120) scale(${size}) translate(-120 -120)">${ears}${bodyShape(g.species,g.c,g.c2)}${patternArt(g.pattern,g.c2)}${face({mood,eye:g.eye,eyeY:118,gap:46,r:10,mouthY:138})}${featureArt(g.feature)}</g>`;
}
function babySVG(g){return `<svg viewBox="0 0 240 240">${babyInner(g)}</svg>`;}

function unlockText(){
  if(!state.hatched)return"一颗盲盒蛋。点「开蛋」看看会开出什么颜色。";
  const p=ph();
  if(p<2)return"刚破壳，还很小，只会看着你。";
  if(p<3)return"已解锁：轻触回应。";
  if(p<4)return"已解锁：摸摸、简单撒娇。";
  if(p<5)return"已解锁：吐槽与玩笑。";
  if(p<6)return"已解锁：更多动作回应。";

  if(p<8)return"已解锁：恋爱与关系事件。";

  $("#growthN").textContent=Math.round(state.growth);
  $("#famBar").style.width=state.fam+'%';
  $("#famN").textContent=Math.round(state.fam);
  $("#stages").innerHTML=x.stages.map((s,i)=>`<div class="stageChip ${i===p?'on':''}">${s}</div>`).join('');

  $("#partnerPet").textContent=SPECIES[partner.char].emo+" "+SPECIES[partner.char].cn+" · "+partner.variant.n;
  $("#loveLine").textContent="关系："+(state.love<20?"初次见面":state.love<45?"朋友":state.love<70?"暧昧":state.love<90?"恋爱":"老夫老妻")+" · Love "+Math.round(state.love);
  const gene=state.genes||geneOf(state.char,state.variant||VARIANTS[state.char][0]);
  $("#geneGrid").innerHTML=[["物种",SPECIES[gene.species].cn],["形态",gene.variantName+" · "+gene.rarity],["特征",gene.feature],["耳朵",gene.ear],["眼睛",gene.eye],["花纹",gene.pattern],["体型",gene.size],["性格倾向",gene.trait]].map(([k,val])=>`<div><b>${k}</b><br>${val}</div>`).join('');
  $("#comboNote").textContent="🎲 组合可能性：184,320 种基因组合（含性格 ×5 约 92 万种）";

  else if(p<9){gb.textContent="⚡ 推进一个成长阶段";}
  else{gb.textContent="已达满级，继续陪伴它";}
  evoTree();renderSocial();renderPartnerBar();
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('on',b.dataset.c===state.char));

function evolveFX(){const s=$("#spark");s.classList.remove('on');void s.offsetWidth;s.classList.add('on');const l=$("#life");l.classList.remove('pop');void l.offsetWidth;l.classList.add('pop');}
function evoTree(){
  const pal=myPal(),a=arch();
  const root=`<svg viewBox="0 0 240 240">${creature(state.char,'happy',pal)}</svg>`;
  const branches=ARCH.map(b=>{const v=state[b.stat];const act=(a.key===b.key);return `<div class="evoNode ${act?'active':''}"><svg viewBox="0 0 240 240">${creature(state.char,b.mood,pal)}</svg><span class="nm">${b.emoji} ${b.key}</span><span class="tp">${Math.round(v)}</span><div class="st"><i style="width:${Math.min(100,v)}%"></i></div></div>`;}).join('');
  $("#evoTree").innerHTML=`<div class="evoRoot"><span style="font-family:var(--fontD);font-size:11px;line-height:1.3">${d().cn}<br>${a.emoji} ${a.key}${a.sub?"·"+a.sub:""}</span>${root}</div><div class="evoLink">▼ 性格分化 ▼</div><div class="evoBranches">${branches}</div>`;

function renderSocial(){

function popHearts(){const h=$("#hearts"),emojis=['❤️','💕','💖','✨'];for(let i=0;i<5;i++){const s=document.createElement('span');s.className='heartPop';s.textContent=pick(emojis);s.style.left=((Math.random()*44)-22)+'px';s.style.animationDelay=(Math.random()*0.4)+'s';h.appendChild(s);setTimeout(()=>s.remove(),1800);}}

/* ---------- 开蛋动画（两段） ---------- */
let hatchTimer=null;
function hatch(){
  if(state.hatched||state.cracking)return;
  state.cracking=true;renderLife();say('蛋在动了……',900);
  const targetChar=state.char;
  hatchTimer=setTimeout(()=>{
    if(state.hatched||targetChar!==state.char)return;
    state.cracking=false;
    state.variant=weightedPick(VARIANTS[state.char]);
    state.hatched=true;state.growth=12;state.genes=geneOf(state.char,state.variant);
    const v=state.variant,rar=v.r;
    evolveFX();
    say("破壳啦！是一只「"+v.n+d().cn+"」！"+(rar!=="普通"?(" "+rar+"形态！"):""),2600);
    if(rar!=="普通")setTimeout(()=>say(rar==="隐藏"?"💎 隐藏款！超稀有！":"✨ 稀有款！",1800),1400);
    render();
  },900);
}

function interact(k){
  if(!state.hatched){
    if(k==='talk'){say(pick(['（蛋轻轻晃了晃）','里面好像有声音……','先开蛋嘛。','咕噜咕噜……']));return;}
    if(k==='shake'){say('别摇！蛋会晕的！');return;}
    say('蛋还在睡觉，先点「开蛋」吧。');return;
  }
  if(k==='talk'){say(talkLine());return;}
  if(k==='pet'){
    if(ph()<2){setFace('shy');say(pick(d().petted.shy));return;}
    state.fam=clamp(state.fam+2.5);state.cling=clamp(state.cling+2);
    setFace('love');say(pick(d().petted.warm));render();return;
  }
  if(k==='walk'){state.growth=clamp(state.growth+2);state.energy=clamp(state.energy+1.5);state.explore=clamp(state.explore+0.8);state.fam=clamp(state.fam+.5);state.battery=clamp(state.battery-.3);setFace('happy');say(ph()<2?'摇摇晃晃地学走路……':pick(['今天去哪儿？','出发出发！','跟你一起走走。','风好舒服呀。']));render();return;}
  if(k==='run'){state.growth=clamp(state.growth+3);state.energy=clamp(state.energy+3);state.explore=clamp(state.explore+1);state.battery=clamp(state.battery-.6);setFace('excited');say(pick(['慢一点！我要飞出去啦！','哇哇哇太快了！','等等我等等我！','你跑步像一阵风！']));render();return;}
  if(k==='shake'){state.mischief=clamp(state.mischief+3);state.fam=clamp(state.fam-.4);setFace('dizzy',1800);say(state.char==='milk'?pick(['别摇了！奶泡全糊脸上了！','啊啊啊草莓要飞出去了！']):pick(['晕啦！你故意的是吧！','住手！我头晕！','地震了吗？！']));render();return;}
  if(k==='idle'){state.fam=clamp(state.fam-.7);state.calm=clamp(state.calm+2);state.mischief=clamp(state.mischief+.5);setFace('sleepy');say(state.fam>55?pick(['哟，终于舍得看我了？','等你等得都快长蘑菇了。']):pick(['今天你好忙呀。','我有点无聊了……']));render();return;}
  if(k==='feed'){state.battery=clamp(state.battery+25);state.fam=clamp(state.fam+.7);state.calm=clamp(state.calm+1.2);setFace('excited');say(pick(['啊呜！电真好吃。','再来一口电！','充电线是我的饭碗。','充满电，满血复活！']));render();return;}
  if(k==='drain'){state.battery=clamp(state.battery-25);setFace('sad');say(state.battery<10?'我真的要饿死了……':state.battery<30?'我饿了，给口电吃嘛。':'肚子有点空。');render();return;}
  if(k==='lift'){state.energy=clamp(state.energy+2);state.explore=clamp(state.explore+1);state.fam=clamp(state.fam+1);setFace('surprised');say(pick(['好高呀——！','再举高一点！','我在飞！']));render();return;}
  if(k==='tickle'){state.cling=clamp(state.cling+2);state.mischief=clamp(state.mischief+1);setFace('excited');say(pick(['哈哈哈别挠了！','痒死啦！','住手……哈哈哈！']));render();return;}
  if(k==='flip'){state.mischief=clamp(state.mischief+2);setFace('dizzy',1800);say('世界翻过来了……');render();return;}
  if(k==='play'){state.explore=clamp(state.explore+2);state.energy=clamp(state.energy+1);state.fam=clamp(state.fam+1);setFace('happy');say(pick(d().play));render();return;}
}

async function enableSensors(){
  let btn=$("#sensorBtn"),msg=$("#msg");
  try{
    let r=[];
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')r.push(await DeviceMotionEvent.requestPermission());
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')r.push(await DeviceOrientationEvent.requestPermission());
    if(r.some(x=>x!=='granted'))throw Error('权限未允许');
    btn.textContent='✓ iPhone IMU 已连接';btn.classList.add('ok');
    msg.textContent='已连接。摇晃会晕、跑步会慌、眼球跟着手机方向转。';
    let last=0,buf=[],lastGaze=0;
    window.addEventListener('devicemotion',e=>{
      let now=Date.now(),a=e.acceleration||{},m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
      buf.push({t:now,m,x:a.x||0,y:a.y||0});buf=buf.filter(v=>now-v.t<650);
      if(now-lastGaze>90){
        const gx=clamp((a.x||0)*1.6,-6,6),gy=clamp((a.y||0)*1.4,-5,5);
        const life=$("#life");
        life.style.setProperty('--gx',gx+'px');life.style.setProperty('--gy',gy+'px');
        lastGaze=now;
      }
      if(now-last<500)return;
      let rms=Math.sqrt(buf.reduce((s,v)=>s+v.m*v.m,0)/(buf.length||1)),rev=0;
      for(let i=1;i<buf.length;i++)if(Math.sign(buf[i-1].x)!=Math.sign(buf[i].x)&&Math.abs(buf[i-1].x-buf[i].x)>4)rev++;
      if(rms>5.8&&rev>=4){last=now;interact('shake');}
      else if(m>1.2&&m<4.8){last=now;interact('walk');}
    },true);
  }catch(e){msg.textContent='启用失败：'+e.message+'。请使用 Safari 并允许运动与方向访问。';}
}
$("#sensorBtn").onclick=enableSensors;
$("#secure").textContent=window.isSecureContext?'✓ HTTPS':'⚠ 非 HTTPS';
